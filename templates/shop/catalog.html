{% extends 'base.html' %}{% block title %}Уся кава · Плин{% endblock %}
{% block content %}<section class="container section catalog-section"><p class="eyebrow">КОЛЕКЦІЯ ПЛИН</p><h1 class="page-title">Кава під твій <em>настрій.</em></h1><p class="lead">Обирай походження, обсмаження й спосіб приготування.<br>Ми залишили місце для твого улюбленого смаку.</p><form method="get" action="{% url 'catalog' %}" class="filters" hx-get="{% url 'catalog' %}" hx-target="#catalog-results" hx-push-url="true"><div><label for="search">Пошук</label><input id="search" type="search" name="q" value="{{ term }}" placeholder="Назва або смак"></div><div><label for="origin">Походження</label><select id="origin" name="origin"><option value="">Усі країни</option>{% for origin in origins %}<option {% if request.GET.origin == origin %}selected{% endif %}>{{ origin }}</option>{% endfor %}</select></div><div><label for="roast">Обсмаження</label><select id="roast" name="roast"><option value="">Будь-яке</option>{% for value,label in roasts %}<option value="{{ value }}" {% if request.GET.roast == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></div><div><label for="method">Спосіб</label><select id="method" name="method"><option value="">Усі способи</option>{% for method in methods %}<option value="{{ method.slug }}" {% if request.GET.method == method.slug %}selected{% endif %}>{{ method.name }}</option>{% endfor %}</select></div><div><label for="sort">Сортування</label><select id="sort" name="sort"><option value="">Наша добірка</option><option value="price" {% if request.GET.sort == 'price' %}selected{% endif %}>Спочатку дешевші</option><option value="-price" {% if request.GET.sort == '-price' %}selected{% endif %}>Спочатку дорожчі</option><option value="name" {% if request.GET.sort == 'name' %}selected{% endif %}>За назвою</option></select></div><button class="button" type="submit">Знайти</button></form>{% include 'shop/catalog_results.html' %}</section>{% endblock %}
